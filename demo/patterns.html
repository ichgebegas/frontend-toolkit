<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Patterns - Frontend Toolkit Demo</title>
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="../snippets/patterns.css?v=20260525-pattern-render">
    <link rel="stylesheet" href="style.css?v=20260525-preview-isolation">
  </head>
  <body>
    <header class="site-header">
      <div class="site-container header-inner">
        <a class="brand" href="index.html" aria-label="Frontend Toolkit"><span class="brand-word">Toolkit</span></a>
        <label class="command-search">
          <span class="search-icon" aria-hidden="true"></span>
          <input id="pattern-search" type="search" placeholder="Search library..." autocomplete="off">
        </label>
        <nav class="site-nav" aria-label="Main navigation">
          <a href="index.html">Categories</a>
          <a href="patterns.html" aria-current="page">Patterns</a>
          <button class="theme-toggle" type="button" data-theme-toggle data-theme-sound aria-label="Switch theme">
            <svg class="theme-morph" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
              <mask id="theme-crescent-mask-patterns"><rect width="24" height="24" fill="white"></rect><circle class="theme-mask-cut" cx="33" cy="0" r="9" fill="black"></circle></mask>
              <circle class="theme-body" cx="12" cy="12" r="5" fill="currentColor" stroke="none" mask="url(#theme-crescent-mask-patterns)"></circle>
              <g class="theme-rays"><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="5.64" y1="5.64" x2="4.22" y2="4.22"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line><line x1="5.64" y1="18.36" x2="4.22" y2="19.78"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line></g>
            </svg>
          </button>
          <a class="github-link" href="https://github.com/ichgebegas/frontend-toolkit" target="_blank" rel="noreferrer" aria-label="GitHub">
            <svg class="github-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 .7a11.3 11.3 0 0 0-3.57 22.02c.57.1.77-.25.77-.55v-2.1c-3.15.69-3.82-1.34-3.82-1.34-.51-1.31-1.26-1.66-1.26-1.66-1.03-.7.08-.69.08-.69 1.13.08 1.73 1.17 1.73 1.17 1.01 1.73 2.64 1.23 3.28.94.1-.73.4-1.23.72-1.51-2.51-.29-5.15-1.26-5.15-5.59 0-1.24.44-2.25 1.16-3.04-.12-.28-.5-1.44.11-3 0 0 .95-.3 3.11 1.16a10.82 10.82 0 0 1 5.66 0c2.16-1.46 3.1-1.16 3.1-1.16.62 1.56.24 2.72.12 3 .72.79 1.16 1.8 1.16 3.04 0 4.34-2.64 5.3-5.16 5.58.4.36.77 1.06.77 2.14v3.17c0 .3.2.66.78.55A11.3 11.3 0 0 0 12 .7Z"/></svg>
          </a>
        </nav>
      </div>
    </header>
    <main class="pattern-library">
      <div class="site-container pattern-shell">
        <header class="pattern-header">
          <h1>Pattern Library</h1>
          <p class="pattern-lead">Preview all <span data-pattern-result-count>52</span> available background patterns with customizable settings</p>
        </header>

        <section class="pattern-settings" aria-label="Global pattern settings">
          <h2>Global Settings</h2>
          <div class="pattern-settings-grid">
            <label>
              <span>Default Background</span>
              <select data-pattern-background>
                <option value="default">default</option>
                <option value="white">white</option>
                <option value="gray">gray</option>
                <option value="dark" selected>dark</option>
                <option value="gradient">gradient</option>
                <option value="primary">primary</option>
                <option value="secondary">secondary</option>
                <option value="transparent">transparent</option>
                <option value="muted">muted</option>
              </select>
            </label>
            <label>
              <span>Default Opacity</span>
              <input data-pattern-opacity type="number" min="0" max="1" step="0.01" value="0.08">
            </label>
            <button type="button" data-pattern-reset>Reset All Patterns</button>
          </div>
        </section>

        <section class="pattern-results" data-pattern-family>
          <div class="pattern-stack" data-pattern-grid></div>
        </section>
      </div>
    </main>
    <template id="pattern-card-template">
      <article class="pattern-card" data-pattern-variant>
        <header>
          <h2 class="pattern-name"></h2>
          <button type="button" class="pattern-copy" data-pattern-copy>Copy</button>
        </header>
        <div class="pattern-preview pattern-surface" data-background="dark">
          <span class="os-pattern" aria-hidden="true"></span>
          <span class="pattern-preview-name"></span>
        </div>
        <div class="pattern-card-controls">
          <label>
            <span>Background</span>
            <select data-local-background></select>
          </label>
          <label>
            <span>Pattern Opacity</span>
            <input data-local-opacity type="number" min="0" max="1" step="0.01" value="0.08">
          </label>
        </div>
      </article>
    </template>
    <script src="script.js?v=20260531-remove-testimonials"></script>
  </body>
</html>

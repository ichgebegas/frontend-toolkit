<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>About Story Gallery - About</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="../../../snippets/patterns.css?v=20260525-pattern-render">
  </head>
  <body>
    <section class="story-gallery">
      <div class="story-gallery__pattern os-pattern" data-pattern="squareAltGrid" style="--os-pattern-opacity: 1" aria-hidden="true"></div>
      <div class="story-gallery__container">
        <header>
          <h1>Our Journey in Pictures</h1>
          <p>From our humble beginnings to where we are today, every milestone tells a story of growth, learning, and unwavering commitment to excellence.</p>
        </header>
        <div class="gallery-grid">
          <button type="button" data-gallery-image><img src="https://toastability-production.s3.amazonaws.com/ehgbcugs782765ke1l2dtbtzd918" alt="Analytics workspace"></button>
          <button type="button" data-gallery-image><img src="https://toastability-production.s3.amazonaws.com/kka8f550on7acx1lf82xleu6zhzo" alt="Team strategy session"></button>
          <button type="button" data-gallery-image><img src="https://toastability-production.s3.amazonaws.com/67fnapqepn7f8vwt0x4nqho70hbz" alt="Notebook and coffee"></button>
          <button type="button" data-gallery-image><img src="https://toastability-production.s3.amazonaws.com/t4cidbsfz3z468bn45yqdrkbx7ou" alt="Studio planning"></button>
          <button type="button" data-gallery-image><img src="https://toastability-production.s3.amazonaws.com/gq3c9qalkiomu0rzdzxymkdaazdu" alt="Workspace detail"></button>
          <button type="button" data-gallery-image><img src="https://toastability-production.s3.amazonaws.com/9ujya2tfhxja7y5s9wb7d2u8crhd" alt="Team office"></button>
        </div>
      </div>
    </section>
    <div class="lightbox" role="dialog" aria-modal="true" aria-label="Image preview" hidden>
      <button class="lightbox__close" type="button" aria-label="Close gallery">x</button>
      <button class="lightbox__previous" type="button" aria-label="Previous image">&lt;</button>
      <img class="lightbox__image" alt="">
      <button class="lightbox__next" type="button" aria-label="Next image">&gt;</button>
      <p class="lightbox__caption"></p>
    </div>
    <script src="script.js"></script>
  </body>
</html>
